<header class="header" role="banner">
    <div class="header__container container">
        <!-- Минималистичная мобильная версия заголовка -->
        <div class="header__mobile minimal-mobile-header">
            <!-- Логотип и бренд -->
            <a href="#hero" class="minimal-brand">
                <img src="icons/logo-cond-icon.svg" alt="ClimaTech Logo" class="minimal-logo" decoding="async" fetchpriority="high">
                <span class="minimal-brand-text">ClimaTech</span>
            </a>
            
            <!-- Гамбургер меню -->
            <button class="minimal-menu-btn" aria-label="Открыть меню навигации" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>

        <!-- Мобильное выпадающее меню -->
    <nav class="mobile-nav" role="navigation" aria-hidden="true">
            <button class="mobile-nav__close" type="button" aria-label="Закрыть меню">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="icons/icons-sprite.svg#icon-close"></use>
                </svg>
                <span class="visually-hidden">Закрыть</span>
            </button>
            <ul class="mobile-nav__list">
                <!-- Компактные настройки (перемещено вверх) -->
                <li class="mobile-nav__item mobile-settings">
                    <div class="mobile-settings__row" role="group" aria-label="Быстрые настройки">
                        <button class="mobile-settings__btn mobile-settings__cart" id="mobileCartButton" aria-label="Открыть корзину" type="button" onclick="location.hash='#cart'">
                            <span class="mobile-settings__icon" aria-hidden="true"><img src="icons/cart512x512.svg" alt="корзина" style="width: 24px; height: 24px;"></span>
                            <span class="cart-count" id="mobileCartCount" aria-live="polite" aria-atomic="true">0</span>
                        </button>
                        <button class="mobile-settings__btn mobile-settings__theme theme-toggle mobile-theme-toggle" id="mobileThemeToggle" aria-label="Переключить тему" type="button" aria-pressed="false">
                            <span class="theme-icon" aria-hidden="true"><img src="icons/moons-icon.svg" alt="Тёмная тема" width="24" height="24"></span>
                        </button>
                        <button class="open-language-overlay" type="button" data-i18n="change-language" aria-controls="welcomeOverlay" aria-haspopup="dialog">Сменить язык</button>
                        <div class="mobile-badges">
                            <span class="mobile-badge mobile-badge--favorite" id="mobileFavoriteBadge" data-label="Избранное" data-i18n-label="badge-favorites" hidden aria-live="polite" aria-atomic="true">0</span>
                            <span class="mobile-badge mobile-badge--compare" id="mobileCompareBadge" data-label="Сравнение" data-i18n-label="badge-compare" hidden aria-live="polite" aria-atomic="true">0</span>
                        </div>
                    </div>
                </li>
                <li class="mobile-nav__item">
                    <a href="#home" class="mobile-nav__link" data-i18n="nav-home">Главная</a>
                </li>
                <li class="mobile-nav__item">
                    <a href="#services" class="mobile-nav__link" data-i18n="nav-services">Услуги</a>
                </li>
                <!-- Удаляем каталог товаров для визитки -->
                <li class="mobile-nav__item">
                    <a href="#about-page" class="mobile-nav__link" data-i18n="nav-about">О нас</a>
                </li>
                <li class="mobile-nav__item">
                    <a href="#contacts" class="mobile-nav__link" data-i18n="nav-contacts">Контакты</a>
                </li>
                <!-- Настройки -->
                <li class="mobile-nav__divider"></li>
                <li class="mobile-nav__item">
                    <button class="mobile-nav__profile" id="mobileProfileButton" data-i18n="login" aria-label="Войти">
                        Войти
                    </button>
                </li>
                
                <!-- Телефоны -->
                <li class="mobile-nav__divider"></li>
                <li class="mobile-nav__item mobile-nav__phones">
                    <a href="tel:+380633353410" aria-label="Позвонить +380-63-335-34-10">
                        📞 +380-63-335-34-10
                    </a>
                    <a href="tel:+380995543499" aria-label="Позвонить +380-99-554-34-99">
                        📞 +380-99-554-34-99
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Десктопная версия заголовка -->
        <div class="header__desktop">
            <div class="header__top-bar">
                <nav class="header__nav" aria-label="Основная навигация">
                    <ul class="header__nav-list">
                        <li class="header__nav-item"><a href="#home" class="header__nav-link" data-i18n="nav-home">Главная</a></li>
                        <li class="header__nav-item"><a href="#services" class="header__nav-link" data-i18n="nav-services">Услуги</a></li>
                        <li class="header__nav-item"><a href="#portfolio-page" class="header__nav-link" data-i18n="nav-portfolio">Наши работы</a></li>
                        <li class="header__nav-item"><a href="#products" class="header__nav-link" data-i18n="nav-products">Товары</a></li>
                        <li class="header__nav-item"><a href="#about-page" class="header__nav-link" data-i18n="nav-about">О нас</a></li>
                        <li class="header__nav-item"><a href="#contacts" class="header__nav-link" data-i18n="nav-contacts">Контакты</a></li>
                    </ul>
                </nav>
                <div class="header__controls">
                    <!-- Коллекции отключены в режиме визитки -->
                    <a id="adminPageLink" href="#admin/products" class="btn" style="display:none" aria-label="Открыть админ-страницу" data-i18n="admin-link">Админка</a>
                    <button class="profile-button" id="profileButton" data-i18n="login" aria-label="Войти или профиль">Войти</button>
                    <button class="theme-toggle" aria-label="Переключить тему">
                        <span class="theme-icon"><img src="icons/moons-icon.svg" alt="Тёмная тема" width="20" height="20"></span>
                    </button>
                    <button class="open-language-overlay" type="button" data-i18n="change-language" aria-controls="welcomeOverlay" aria-haspopup="dialog">Сменить язык</button>
                </div>
            </div>
            <div class="header__main-bar">
                <div class="header__title" tabindex="-1" aria-hidden="true">
                    <img src="icons/logo-icon.svg" alt="ClimaTech Logo" class="header__logo" decoding="async" fetchpriority="high">
                    <span class="header__brand-text">
                        <span class="clima-text">Clima</span><span class="tech-text">Tech</span>
                    </span>
                    <span class="visually-hidden">ClimaTech</span>
                </div>
            <!-- Кнопка каталога скрыта для визитки -->
            <!-- Глобальный поиск убран для режима визитки -->
            <div class="header__phones">
                <a href="tel:+380633353410" aria-label="Позвонить по номеру +380-63-335-34-10"><img src="icons/icon-phone512x512.svg" alt="icon phone" style="width: 16px; height: 16px; vertical-align: sub; fill: currentColor;">  +380-63-335-34-10</a>
                <a href="tel:+380995543499" aria-label="Позвонить по номеру +380-99-554-34-99"><img src="icons/icon-phone512x512.svg" alt="icon phone" style="width: 16px; height: 16px; vertical-align: sub; fill: currentColor;">  +380-99-554-34-99</a>
            </div>
            <!-- Кнопка корзины скрыта для визитки -->
            <button class="header__toggle" aria-controls="header-nav" aria-expanded="false" aria-label="Открыть меню навигации">
                <span class="header__toggle-icon" aria-hidden="true"></span>
            </button>
            </div>
        </div>
    </div>
</header>
<!-- Независимая кнопка включения админ-режима (не влияет на layout) — скрыта для landing mode -->
<button id="adminToggleBtn" type="button"
        aria-pressed="false" aria-label="Включить режим администратора"
        title="Admin"
    style="display:none; position:fixed; top:8px; right:8px; padding:6px 10px; font-size:12px; line-height:1; border-radius:8px; background: var(--color-surface, #222); color: var(--color-on-surface, #fff); border:1px solid rgba(255,255,255,0.2); box-shadow: 0 2px 6px rgba(0,0,0,0.15); opacity:0.85; z-index:1701; cursor:pointer; user-select:none;">
  Admin
</button>
<div class="modal" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle" aria-describedby="modalContent">
    <div class="modal__content">
        <button class="modal__close" aria-label="Закрыть модальное окно">✕</button>
    <h2 id="profileModalTitle" class="visually-hidden">Профиль пользователя</h2>
    <div id="modalContent" aria-live="polite" aria-atomic="true"></div>
    </div>
</div>
